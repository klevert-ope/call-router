[global]
type=global
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Behind NAT, set external_media_address, external_signaling_address and local_net.

[telnyx-auth]
type=auth
auth_type=userpass
username=REPLACE_TELNYX_SIP_USERNAME
password=REPLACE_TELNYX_SIP_PASSWORD

[telnyx-registration]
type=registration
transport=transport-udp
outbound_auth=telnyx-auth
server_uri=sip:sip.telnyx.com
client_uri=sip:REPLACE_TELNYX_SIP_USERNAME@sip.telnyx.com
; Use your Telnyx DID in E.164 format. Set Telnyx inbound destination formatting
; to +E.164 so the backend can verify the called number.
contact_user=REPLACE_TELNYX_DID_E164
retry_interval=60
expiration=600

[telnyx-in]
type=endpoint
transport=transport-udp
context=from-telnyx
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Count received RTP, not speech. Validate these limits with carrier DTX/hold.
rtp_timeout=120
rtp_timeout_hold=600
rtp_keepalive=30
identify_by=ip

[telnyx-in-identify]
type=identify
endpoint=telnyx-in
; Add every current signaling IP/CIDR for the selected Telnyx SIP region.
; https://support.telnyx.com/en/articles/1130676-configuring-an-asterisk-credentials-trunk
match=REPLACE_TELNYX_SIGNALING_IP_OR_CIDR

[telnyx-out]
type=aor
contact=sip:sip.telnyx.com
qualify_frequency=60

[telnyx-out]
type=endpoint
transport=transport-udp
context=reject
disallow=all
allow=ulaw,alaw
direct_media=no
outbound_auth=telnyx-auth
aors=telnyx-out
from_domain=sip.telnyx.com
send_pai=yes
; Leave from_user unset: CALLERID(num) supplies the verified personal number.
; SIP digest authentication uses telnyx-auth, independently of caller ID.
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=120
rtp_timeout_hold=600
rtp_keepalive=30

[vapi-auth]
type=auth
auth_type=userpass
username=REPLACE_VAPI_SIP_USERNAME
password=REPLACE_VAPI_SIP_PASSWORD

[vapi]
type=endpoint
outbound_auth=vapi-auth
transport=transport-udp
context=reject
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; A muted assistant may legitimately send no RTP. Do not use its receive
; inactivity to terminate the caller. Operator health is reconciled separately.
rtp_timeout=0
rtp_timeout_hold=0
rtp_keepalive=30
; Leave from_user unset: the per-generation random caller ID binds Vapi.
